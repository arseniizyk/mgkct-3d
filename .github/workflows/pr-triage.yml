name: PR Triage

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  triage:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign author and request reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // 1. Auto-assign PR author
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [author]
              });
              console.log(`Successfully assigned author @${author} to PR #${pr.number}`);
            } catch (err) {
              console.warn(`Failed to assign author: ${err.message}`);
            }

            // 2. Request reviewers: arseniizyk, n-romanovich, and TPpixel (excluding author)
            const targetReviewers = ['arseniizyk', 'n-romanovich', 'TPpixel'].filter(
              r => r.toLowerCase() !== author.toLowerCase()
            );

            if (targetReviewers.length > 0) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  reviewers: targetReviewers
                });
                console.log(`Requested review from: ${targetReviewers.join(', ')}`);
              } catch (err) {
                console.warn(`Failed to request reviewers: ${err.message}`);
              }
            }
