<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Интерактивная карта — Колледж МГКЦТ</title>
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Three.js & OrbitControls -->
    <script src="js/vendor/three.min.js"></script>
    <script src="js/vendor/OrbitControls.js"></script>
    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#12151a] text-slate-100 overflow-hidden select-none">

    <!-- Контейнер Three.js сцены -->
    <div id="canvas-container"></div>
    <!-- 2D Canvas для кристально чётких надписей номеров кабинетов (Screen-Space Retina) -->
    <canvas id="labels-overlay-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:15; pointer-events:none;"></canvas>

    <!-- Верхняя панель навигации (адаптивная, оптимизирована под мобильный телефон) -->
    <header class="ui-overlay fixed top-2 left-2 right-2 max-w-[calc(100vw-16px)] sm:top-3 sm:left-4 sm:max-w-xl z-20 flex flex-col gap-1.5 pointer-events-none">
        <div class="glass-panel rounded-2xl px-3 py-2 sm:px-4 sm:py-2.5 flex items-center justify-between pointer-events-auto shadow-xl w-full">
            <!-- Левая часть: логотип, название и текущий этаж -->
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-sky-600/20 border border-sky-500/40 flex items-center justify-center text-sky-400 shadow-sm flex-shrink-0">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                    </svg>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <h1 class="text-xs sm:text-sm font-bold tracking-tight text-slate-100 truncate">Карта МГКЦТ</h1>
                        <span id="top-floor-badge" class="px-2 py-0.5 rounded-md font-bold text-[11px] bg-sky-500/20 text-sky-300 border border-sky-400/30 flex-shrink-0">
                            1 этаж
                        </span>
                    </div>
                    <p class="text-[10px] sm:text-[11px] text-slate-400 truncate hidden xs:block">Минск, ул. Казинца, 91</p>
                </div>
            </div>

            <!-- Правая часть: кнопка поиска и меню настроек -->
            <div class="flex items-center gap-1.5 flex-shrink-0">
                <button id="btn-open-search" title="Поиск кабинета" class="btn-interactive w-9 h-9 rounded-xl flex items-center justify-center bg-slate-800/80 hover:bg-slate-700/80 text-slate-200 border border-slate-700/80 transition shadow-sm">
                    <svg class="w-4 h-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
                <button id="btn-open-settings" title="Слои и параметры" class="btn-interactive w-9 h-9 rounded-xl flex items-center justify-center bg-slate-800/80 hover:bg-slate-700/80 text-slate-200 border border-slate-700/80 transition shadow-sm">
                    <svg class="w-4 h-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Горизонтальная строка выбора корпуса (плавный скролл пальцем на телефоне) -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pointer-events-auto px-1 py-0.5 w-full max-w-full">
            <button id="btn-bldg-both" class="bldg-chip active" data-bldg="both">Все корпуса</button>
            <button id="btn-bldg-1" class="bldg-chip" data-bldg="1">Корпус 1 (1–7 эт.)</button>
            <button id="btn-bldg-2" class="bldg-chip" data-bldg="2">Корпус 2 (1–3 эт.)</button>
            <button id="btn-bldg-3" class="bldg-chip" data-bldg="3">Корпус 3 (1–2 эт.)</button>
            <button id="btn-bldg-4" class="bldg-chip" data-bldg="4">Корпус 4 (1–3 эт.)</button>
        </div>
    </header>

    <!-- Правый плавающий селектор этажей (как в 2GIS / Google Maps / Apple Maps) -->
    <nav class="ui-overlay floor-switcher-bar glass-panel" aria-label="Выбор этажа">
        <span class="text-[9px] font-extrabold text-slate-400 uppercase tracking-widest my-0.5">Эт</span>
        <button id="floor-btn-7" class="floor-btn" data-floor="7" title="7 этаж">7</button>
        <button id="floor-btn-6" class="floor-btn" data-floor="6" title="6 этаж">6</button>
        <button id="floor-btn-5" class="floor-btn" data-floor="5" title="5 этаж">5</button>
        <button id="floor-btn-4" class="floor-btn" data-floor="4" title="4 этаж">4</button>
        <button id="floor-btn-3" class="floor-btn" data-floor="3" title="3 этаж">3</button>
        <button id="floor-btn-2" class="floor-btn" data-floor="2" title="2 этаж">2</button>
        <button id="floor-btn-1" class="floor-btn active" data-floor="1" title="1 этаж">1</button>
    </nav>

    <!-- Правые плавающие кнопки управления картой (2D/3D, компас/север, масштаб) -->
    <div class="ui-overlay map-fab-bar">
        <!-- Кнопка переключения 2D вид сверху / 3D изометрия -->
        <button id="btn-toggle-2d" class="map-fab-btn font-extrabold text-[12px] text-sky-400" title="Переключить 2D карта сверху / 3D ракурс">
            2D
        </button>
        <!-- Кнопка компаса (сброс поворота на Север и центрирование) -->
        <button id="btn-compass" class="map-fab-btn" title="Ориентация строго на Север">
            <svg class="w-4 h-4 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2l3 8-3-2-3 2 3-8z" fill="#f43f5e" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 22l-3-8 3 2 3-2-3 8z" fill="#94a3b8" />
            </svg>
        </button>
        <!-- Кнопки масштабирования -->
        <div class="flex flex-col gap-1 bg-slate-900/60 rounded-xl p-0.5 border border-slate-700/50">
            <button id="btn-zoom-in" class="map-fab-btn !w-9 !h-9 !rounded-lg !border-none !shadow-none" title="Приблизить">
                <svg class="w-4 h-4 text-slate-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
            <div class="h-[1px] bg-slate-700/40 mx-1"></div>
            <button id="btn-zoom-out" class="map-fab-btn !w-9 !h-9 !rounded-lg !border-none !shadow-none" title="Отдалить">
                <svg class="w-4 h-4 text-slate-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M20 12H4" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Модальное окно поиска кабинетов -->
    <div id="search-backdrop" class="drawer-backdrop"></div>
    <div id="search-modal" class="search-modal glass-panel p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between pb-1 border-b border-slate-700/60">
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <span class="text-xs font-bold text-slate-200 uppercase tracking-wider">Поиск кабинета</span>
            </div>
            <button id="btn-close-search" class="text-slate-400 hover:text-slate-100 p-1 rounded-lg">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="relative">
            <input id="search-input" type="text" placeholder="Введите номер (например, 2-102, 1-105, столовая)..." 
                   class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder-slate-500 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition">
        </div>

        <!-- Быстрые теги поиска -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-[11px]">
            <button class="search-tag-chip px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60" data-query="2-102">2-102</button>
            <button class="search-tag-chip px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60" data-query="1-105">1-105</button>
            <button class="search-tag-chip px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60" data-query="4-104">4-104</button>
            <button class="search-tag-chip px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60" data-query="Столовая">Столовая</button>
            <button class="search-tag-chip px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60" data-query="С/У">С/У</button>
        </div>

        <!-- Список результатов -->
        <div id="search-results" class="max-h-60 overflow-y-auto custom-scroll flex flex-col gap-1 pr-1">
            <div class="text-center py-6 text-xs text-slate-500">Начните ввод номера аудитории...</div>
        </div>
    </div>

    <!-- Боковая/нижняя шторка параметров (Settings Drawer) -->
    <div id="settings-backdrop" class="drawer-backdrop"></div>
    <aside id="settings-drawer" class="side-drawer p-4 sm:p-5 flex flex-col gap-4 text-xs overflow-y-auto custom-scroll" aria-label="Параметры отображения">
        <!-- Шапка шторки -->
        <div class="flex items-center justify-between pb-2 border-b border-slate-700/60">
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                </svg>
                <h2 class="font-bold text-slate-100 uppercase tracking-wider text-xs">Параметры карты</h2>
            </div>
            <button id="btn-close-settings" class="text-slate-400 hover:text-slate-100 p-1 rounded-lg">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- 1. Высота стен (минимальная для карты, либо высокая для 3D) -->
        <div class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-3 flex flex-col gap-2.5">
            <div class="flex justify-between items-center text-[11px]">
                <span class="text-slate-300 font-semibold uppercase tracking-wider">Высота стен</span>
                <span id="wall-height-val" class="font-mono text-sky-400 bg-sky-950/60 border border-sky-800/50 px-2 py-0.5 rounded font-bold">0.35 м</span>
            </div>
            <input id="slider-wall-height" type="range" min="0.15" max="3.0" step="0.05" value="0.35" class="w-full cursor-pointer">
            <div class="grid grid-cols-3 gap-1.5 pt-1">
                <button id="btn-wall-min" class="btn-interactive py-1 px-1.5 rounded-lg text-center font-medium bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-700/60 text-[11px]">
                    0.35 м (Карта)
                </button>
                <button id="btn-wall-mid" class="btn-interactive py-1 px-1.5 rounded-lg text-center font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 text-[11px]">
                    1.20 м
                </button>
                <button id="btn-wall-max" class="btn-interactive py-1 px-1.5 rounded-lg text-center font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 text-[11px]">
                    2.40 м (3D)
                </button>
            </div>
        </div>

        <!-- 2. Размер шрифта номеров кабинетов -->
        <div class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-3 flex flex-col gap-2">
            <div class="text-slate-300 font-semibold uppercase tracking-wider text-[11px]">
                Размер номеров кабинетов
            </div>
            <div class="grid grid-cols-3 gap-1.5">
                <button id="btn-labelsize-normal" class="labelsize-btn btn-interactive py-1 px-1.5 rounded-lg text-center font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 text-[11px]">
                    Стандарт
                </button>
                <button id="btn-labelsize-large" class="labelsize-btn btn-interactive active py-1 px-1.5 rounded-lg text-center font-medium bg-sky-600 text-white border border-sky-400 text-[11px]">
                    Крупный
                </button>
                <button id="btn-labelsize-xl" class="labelsize-btn btn-interactive py-1 px-1.5 rounded-lg text-center font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 text-[11px]">
                    Максимум
                </button>
            </div>
        </div>

        <!-- 3. Режимы просмотра -->
        <div class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-3 flex flex-col gap-2">
            <div class="text-slate-300 font-semibold uppercase tracking-wider text-[11px]">
                Ракурс камеры
            </div>
            <div class="grid grid-cols-2 gap-1.5">
                <button id="btn-view-top" class="btn-interactive bg-sky-600/30 hover:bg-sky-600/40 text-sky-200 border border-sky-500/40 py-1.5 px-2 rounded-lg font-medium text-center">
                    Вид сверху (2D)
                </button>
                <button id="btn-view-3d" class="btn-interactive bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 py-1.5 px-2 rounded-lg font-medium text-center">
                    3D Изометрия
                </button>
                <button id="btn-view-305" class="btn-interactive bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 py-1.5 px-2 rounded-lg font-medium text-center">
                    Узел переходов
                </button>
                <button id="btn-view-side" class="btn-interactive bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 py-1.5 px-2 rounded-lg font-medium text-center">
                    Сравнение рядом
                </button>
            </div>
        </div>

        <!-- 4. Срез этажей и разнос (для 3D режима) -->
        <div class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-3 flex flex-col gap-2.5">
            <div class="flex justify-between items-center text-[11px]">
                <span class="text-slate-300 font-semibold uppercase tracking-wider">Срез этажей (1–7)</span>
                <span id="slice-val" class="font-mono text-slate-300 bg-slate-800 border border-slate-700 px-1.5 py-0.5 rounded text-[11px]">1–7 эт.</span>
            </div>
            <input id="slider-slice" type="range" min="1" max="7" step="1" value="7" class="w-full cursor-pointer">

            <div class="flex justify-between items-center text-[11px] pt-1">
                <span class="text-slate-300 font-semibold uppercase tracking-wider">Разнос этажей в 3D</span>
                <span id="explode-val" class="font-mono text-slate-300 bg-slate-800 border border-slate-700 px-1.5 py-0.5 rounded text-[11px]">0.0 м</span>
            </div>
            <input id="slider-explode" type="range" min="0" max="14" step="0.2" value="0" class="w-full cursor-pointer">
        </div>

        <!-- 5. Слои и видимость -->
        <div class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-3 flex flex-col gap-2">
            <div class="text-slate-300 font-semibold uppercase tracking-wider text-[11px]">
                Слои и элементы
            </div>
            <label class="flex items-center justify-between cursor-pointer py-0.5">
                <span class="text-slate-300">Номера кабинетов</span>
                <input id="toggle-labels" type="checkbox" checked class="switch-input">
                <div class="switch-track"><div class="switch-thumb"></div></div>
            </label>
            <label class="flex items-center justify-between cursor-pointer py-0.5">
                <span class="text-slate-300">Двери и проходы</span>
                <input id="toggle-doors" type="checkbox" checked class="switch-input">
                <div class="switch-track"><div class="switch-thumb"></div></div>
            </label>
            <label class="flex items-center justify-between cursor-pointer py-0.5">
                <span class="text-slate-300">Контуры чертежа (Edges)</span>
                <input id="toggle-edges" type="checkbox" checked class="switch-input">
                <div class="switch-track"><div class="switch-thumb"></div></div>
            </label>
            <label class="flex items-center justify-between cursor-pointer py-0.5">
                <span class="text-slate-300">Мягкие тени</span>
                <input id="toggle-shadows" type="checkbox" class="switch-input">
                <div class="switch-track"><div class="switch-thumb"></div></div>
            </label>
            <label class="flex items-center justify-between cursor-pointer py-0.5">
                <span class="text-slate-300">Прилегающая территория</span>
                <input id="toggle-territory" type="checkbox" class="switch-input">
                <div class="switch-track"><div class="switch-thumb"></div></div>
            </label>
            <label class="flex items-center justify-between cursor-pointer py-0.5">
                <span class="text-slate-300">Крыша здания</span>
                <input id="toggle-roof" type="checkbox" class="switch-input">
                <div class="switch-track"><div class="switch-thumb"></div></div>
            </label>
        </div>

        <!-- 6. Сброс настроек -->
        <button id="btn-reset-settings" class="btn-interactive w-full py-2.5 px-3 rounded-xl font-semibold text-rose-300 bg-rose-950/30 hover:bg-rose-950/50 border border-rose-800/40 transition flex items-center justify-center gap-2 mt-auto">
            <svg class="w-4 h-4 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span>Сбросить настройки карты</span>
        </button>
    </aside>

    <!-- Скрытые элементы для совместимости со старыми вызовами -->
    <div style="display:none">
        <button id="btn-mode-all"></button>
        <button id="btn-mode-side"></button>
        <button id="btn-mode-1"></button>
        <button id="btn-mode-2"></button>
        <button id="btn-mode-3"></button>
        <button id="btn-mode-4"></button>
        <button id="btn-mode-5"></button>
        <button id="btn-mode-6"></button>
        <button id="btn-mode-7"></button>
        <button id="btn-explode"></button>
        <button id="btn-preset-eco"></button>
        <button id="btn-preset-balance"></button>
        <button id="btn-preset-ultra"></button>
        <input id="slider-slab-opacity" type="range" min="0.25" max="1.0" step="0.05" value="1.0">
        <span id="slab-opacity-val">100%</span>
        <input id="toggle-smart-occlusion" type="checkbox" checked>
        <input id="toggle-stair-axes" type="checkbox">
        <input id="toggle-guides" type="checkbox">
        <span id="status-subtitle"></span>
    </div>

    <!-- Подключение JS модулей -->
    <script src="js/state.js"></script>
    <script src="js/materials.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/buildings/building1.js"></script>
    <script src="js/buildings/building2.js"></script>
    <script src="js/buildings/building3.js"></script>
    <script src="js/buildings/building4.js"></script>
    <script src="js/territory.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
