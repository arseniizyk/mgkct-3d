    <script>
        (function() {
            try {
                var saved = localStorage.getItem('mgkct_theme');
                var theme = (saved === 'dark' || saved === 'light') ? saved : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                if (document.body) {
                    document.body.setAttribute('data-theme', theme);
                } else {
                    document.addEventListener('DOMContentLoaded', function() {
                        if (document.body && !document.body.hasAttribute('data-theme')) {
                            document.body.setAttribute('data-theme', theme);
                        }
                    });
                }
            } catch (_) {}
        })();
    </script>

    <script>
        /* Мгновенная синхронизация активных кнопок HUD из localStorage и URL до первого рендера кадра (0 мс задержки) */
        (function() {
            try {
                var raw = localStorage.getItem("college_3d_map_settings_v3");
                var s = raw ? JSON.parse(raw) : {};
                var params = new URLSearchParams(window.location.search);
                var bldg = params.get("bldg") || s.buildingFilter || "both";
                var mode = params.get("floor") || s.mode || "1";
                var is2D = (typeof s.is2D === "boolean") ? s.is2D : true;
                if (mode === "all") is2D = false;
                var showTerr = params.has("territory") ? (params.get("territory") !== "0") : Boolean(s.showTerritory);
                var maxFloors = { both: 7, "1": 7, "2": 3, "3": 2, "4": 3, "5": 1 }[bldg] || 7;
                if (/^[1-7]$/.test(mode) && parseInt(mode, 10) > maxFloors) mode = String(maxFloors);
                document.querySelectorAll(".bldg-chip").forEach(function(b) {
                    b.classList.toggle("active", b.dataset.bldg === bldg);
                });
                for (var f = 1; f <= 7; f++) {
                    var fBtn = document.getElementById("floor-btn-" + f);
                    if (fBtn) {
                        fBtn.classList.toggle("disabled", f > maxFloors);
                        fBtn.classList.toggle("active", String(f) === String(mode));
                    }
                }
                var allBtn = document.getElementById("floor-btn-all");
                if (allBtn) allBtn.classList.toggle("active", mode === "all");
                var btn2D = document.getElementById("btn-toggle-2d");
                if (btn2D) {
                    btn2D.textContent = is2D ? "2D" : "3D";
                    btn2D.classList.toggle("mode-active", !is2D);
                }
                var btnTerr = document.getElementById("btn-toggle-territory");
                if (btnTerr) btnTerr.classList.toggle("mode-active", showTerr);
            } catch (_) {}
        })();
    </script>
